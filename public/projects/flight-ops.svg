<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.08"/>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#DCE2D6" stroke-width="1"/>
    </pattern>
    <clipPath id="map"><rect x="262" y="150" width="480" height="440"/></clipPath>
  </defs>

  <!-- Figma canvas -->
  <rect width="1200" height="750" fill="#ECECEA"/>
  <text x="40" y="40" font-size="13" fill="#7A7A76">Flight Ops  /  Mission overview  &#8212;  Desktop 1440</text>
  <text x="930" y="96" font-size="13" fill="#7A7A76">Field app  &#8212;  iOS</text>

  <!-- Desktop frame -->
  <g filter="url(#shadow)">
    <rect x="40" y="56" width="870" height="600" rx="6" fill="#FFFFFF" stroke="#DADAD6"/>
  </g>

  <!-- Sidebar -->
  <rect x="40" y="56" width="200" height="600" rx="6" fill="#F7F7F5"/>
  <rect x="40" y="56" width="200" height="600" fill="none" stroke="#E6E6E2"/>
  <rect x="64" y="84" width="14" height="14" rx="2" fill="#121212"/>
  <circle cx="75" cy="95" r="3" fill="#B3261E"/>
  <text x="88" y="96" font-size="14" font-weight="600" fill="#121212">Dronemapping</text>
  <g font-size="13" fill="#5C5C58">
    <rect x="52" y="128" width="176" height="32" rx="4" fill="#FFFFFF" stroke="#E6E6E2"/>
    <text x="72" y="149" fill="#121212" font-weight="500">Missions</text>
    <text x="72" y="189">Fleet</text>
    <text x="72" y="225">Datasets</text>
    <text x="72" y="261">Analysts</text>
    <text x="72" y="297">Reports</text>
    <line x1="64" y1="560" x2="216" y2="560" stroke="#E6E6E2"/>
    <text x="72" y="590">Settings</text>
    <text x="72" y="622">Help</text>
  </g>

  <!-- Top bar -->
  <text x="262" y="96" font-size="11" fill="#8A8A86" letter-spacing="1.2">MISSION #2481</text>
  <text x="262" y="122" font-size="20" font-weight="600" fill="#121212">Solar farm survey &#8212; Ballarat West</text>
  <g>
    <rect x="620" y="103" width="76" height="24" rx="12" fill="#FBEDEB"/>
    <circle cx="634" cy="115" r="4" fill="#B3261E"/>
    <text x="644" y="119" font-size="11" font-weight="600" fill="#B3261E">In flight</text>
  </g>
  <rect x="712" y="100" width="82" height="30" rx="3" fill="#FFFFFF" stroke="#C9C9C4"/>
  <text x="753" y="120" font-size="12" font-weight="500" fill="#121212" text-anchor="middle">Export</text>
  <rect x="802" y="100" width="90" height="30" rx="3" fill="#121212"/>
  <text x="847" y="120" font-size="12" font-weight="500" fill="#FFFFFF" text-anchor="middle">Review data</text>

  <!-- Map -->
  <rect x="262" y="150" width="480" height="440" rx="4" fill="#EEF1EA"/>
  <rect x="262" y="150" width="480" height="440" fill="url(#grid)" clip-path="url(#map)"/>
  <g clip-path="url(#map)" opacity="0.7">
    <path d="M262 470 C 340 440, 380 520, 460 500 S 600 560, 742 520" fill="none" stroke="#C9D3C0" stroke-width="10"/>
    <path d="M262 470 C 340 440, 380 520, 460 500 S 600 560, 742 520" fill="none" stroke="#DDE4D6" stroke-width="2"/>
    <path d="M520 150 L 540 260 L 600 330 L 605 590" fill="none" stroke="#D5DBCD" stroke-width="6"/>
  </g>
  <!-- Survey area -->
  <polygon points="330,215 640,190 690,400 560,470 320,440" fill="#FFFFFF" fill-opacity="0.35" stroke="#121212" stroke-width="1.5" stroke-dasharray="6 5"/>
  <!-- Lawnmower flight path -->
  <g fill="none" stroke="#B3261E" stroke-width="1.5" stroke-linejoin="round">
    <path d="M350 235 L 640 215 L 645 245 L 355 265 L 360 295 L 650 275 L 656 305 L 366 325 L 371 355 L 662 335 L 668 365 L 377 385 L 382 415 L 600 400"/>
  </g>
  <g stroke="#B3261E" stroke-width="1.5" fill="#FFFFFF">
    <circle cx="350" cy="235" r="4"/>
  </g>
  <!-- Drone marker -->
  <g transform="translate(600 400)">
    <circle r="14" fill="#B3261E" fill-opacity="0.15"/>
    <circle r="6" fill="#B3261E" stroke="#FFFFFF" stroke-width="2"/>
  </g>
  <!-- Coverage pill -->
  <rect x="280" y="546" width="128" height="28" rx="14" fill="#FFFFFF" stroke="#DADAD6"/>
  <text x="296" y="565" font-size="12" fill="#121212"><tspan font-weight="600">72 %</tspan> coverage</text>
  <!-- Map controls -->
  <g fill="#FFFFFF" stroke="#DADAD6">
    <rect x="700" y="166" width="26" height="26" rx="3"/>
    <rect x="700" y="192" width="26" height="26" rx="3"/>
  </g>
  <g stroke="#121212" stroke-width="1.4">
    <path d="M713 173v12M707 179h12"/>
    <path d="M707 205h12"/>
  </g>

  <!-- Right panel -->
  <g font-size="11" fill="#8A8A86" letter-spacing="1">
    <text x="762" y="170">IMAGES</text>
    <text x="762" y="238">BATTERY</text>
    <text x="762" y="306">ALTITUDE</text>
    <text x="762" y="374">GSD</text>
  </g>
  <g font-size="22" font-weight="600" fill="#121212">
    <text x="762" y="198">1,248</text>
    <text x="762" y="266">64 %</text>
    <text x="762" y="334">120 m</text>
    <text x="762" y="402">2.6 cm/px</text>
  </g>
  <rect x="762" y="212" width="130" height="3" rx="1.5" fill="#E6E6E2"/>
  <rect x="762" y="212" width="94" height="3" rx="1.5" fill="#121212"/>
  <rect x="762" y="280" width="130" height="3" rx="1.5" fill="#E6E6E2"/>
  <rect x="762" y="280" width="83" height="3" rx="1.5" fill="#B3261E"/>

  <line x1="762" y1="430" x2="892" y2="430" stroke="#E6E6E2"/>
  <text x="762" y="456" font-size="11" fill="#8A8A86" letter-spacing="1">QUALITY FLAGS</text>
  <g font-size="12" fill="#3D3D3D">
    <circle cx="768" cy="480" r="4" fill="#121212"/><text x="782" y="484">Overlap &#8805; 75 %</text>
    <circle cx="768" cy="508" r="4" fill="#121212"/><text x="782" y="512">Exposure stable</text>
    <circle cx="768" cy="536" r="4" fill="#B3261E"/><text x="782" y="540">3 blurred frames</text>
    <circle cx="768" cy="564" r="4" fill="#FFFFFF" stroke="#C9C9C4"/><text x="782" y="568" fill="#8A8A86">GCP check pending</text>
  </g>

  <!-- Phone frame -->
  <g filter="url(#shadow)">
    <rect x="930" y="110" width="236" height="500" rx="30" fill="#121212"/>
    <rect x="938" y="118" width="220" height="484" rx="24" fill="#FFFFFF"/>
  </g>
  <rect x="1012" y="126" width="72" height="18" rx="9" fill="#121212"/>
  <text x="958" y="182" font-size="11" fill="#8A8A86" letter-spacing="1">MISSION #2481</text>
  <text x="958" y="206" font-size="16" font-weight="600" fill="#121212">Pre-flight checklist</text>
  <text x="958" y="226" font-size="11" fill="#6A6A66">5 of 7 completed</text>
  <rect x="958" y="238" width="180" height="3" rx="1.5" fill="#E6E6E2"/>
  <rect x="958" y="238" width="128" height="3" rx="1.5" fill="#121212"/>

  <g font-size="12" fill="#121212">
    <g transform="translate(958 264)">
      <circle cx="8" cy="8" r="8" fill="#121212"/><path d="M4.5 8.5l2.5 2.5 4.5-5" fill="none" stroke="#FFF" stroke-width="1.6"/>
      <text x="26" y="12">Weather window cleared</text>
    </g>
    <g transform="translate(958 300)">
      <circle cx="8" cy="8" r="8" fill="#121212"/><path d="M4.5 8.5l2.5 2.5 4.5-5" fill="none" stroke="#FFF" stroke-width="1.6"/>
      <text x="26" y="12">Battery &#8805; 80 %</text>
    </g>
    <g transform="translate(958 336)">
      <circle cx="8" cy="8" r="8" fill="#121212"/><path d="M4.5 8.5l2.5 2.5 4.5-5" fill="none" stroke="#FFF" stroke-width="1.6"/>
      <text x="26" y="12">Geofence confirmed</text>
    </g>
    <g transform="translate(958 372)">
      <circle cx="8" cy="8" r="8" fill="#121212"/><path d="M4.5 8.5l2.5 2.5 4.5-5" fill="none" stroke="#FFF" stroke-width="1.6"/>
      <text x="26" y="12">SD card formatted</text>
    </g>
    <g transform="translate(958 408)">
      <circle cx="8" cy="8" r="8" fill="#121212"/><path d="M4.5 8.5l2.5 2.5 4.5-5" fill="none" stroke="#FFF" stroke-width="1.6"/>
      <text x="26" y="12">Ground control points set</text>
    </g>
    <g transform="translate(958 444)">
      <circle cx="8" cy="8" r="7.5" fill="#FFF" stroke="#B3261E" stroke-width="1.5"/>
      <text x="26" y="12">Flight permit attached</text>
      <text x="26" y="28" font-size="10" fill="#B3261E">Required before take-off</text>
    </g>
    <g transform="translate(958 494)">
      <circle cx="8" cy="8" r="7.5" fill="#FFF" stroke="#C9C9C4" stroke-width="1.5"/>
      <text x="26" y="12" fill="#6A6A66">Client briefed</text>
    </g>
  </g>
  <rect x="958" y="546" width="180" height="38" rx="4" fill="#C9C9C4"/>
  <text x="1048" y="570" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">Start mission</text>
</svg>
